services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: temperature-alert-demo-mailpit
    ports:
      - "8025:8025"

  n8n:
    image: n8nio/n8n:latest
    container_name: temperature-alert-demo-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Madrid
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/demo-workflows:ro
    depends_on:
      - mailpit
    entrypoint: /bin/sh
    command: >
      -c "n8n import:workflow --input=/demo-workflows/temperature-alert-workflow.json || true;
      n8n publish:workflow --id=temperature-alert-demo || true;
      n8n start"

volumes:
  n8n_data:
